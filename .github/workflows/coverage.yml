# Reusable test-coverage workflow for Kover-based KMP / multi-module projects.
#
# Consumers call this via `uses: MobileByteLabs/mifos-x-actionhub-kover-coverage/.github/workflows/coverage.yml@v1`.
# Discovery is fully dynamic: whatever modules apply the Kover plugin (or a
# Kover convention plugin) emit `build/reports/kover/report.xml`, and this
# workflow checks every one of them against `.kover-floor.yml`.
#
# - Modules NOT listed in `.kover-floor.yml` use `default-floor` (input).
# - Modules listed in `.kover-floor.yml` use their explicit value.
# - If a listed module produced no report.xml, it's a hard fail (lost
#   measurable coverage — the floor file is out of sync with the module
#   set, or the build broke before tests ran).
#
# See examples/consumer-workflow.yml for the consumer-side stub.

name: Coverage Floor (reusable)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'JDK version to set up before running Gradle.'
        type: string
        default: '17'
      java-distribution:
        description: 'JDK distribution (temurin, zulu, etc.).'
        type: string
        default: 'temurin'
      report-task:
        description: 'Gradle task that produces the per-module kover XML reports.'
        type: string
        default: 'koverXmlReport'
      gradle-args:
        description: 'Extra Gradle args appended to the report task invocation.'
        type: string
        default: '--continue --stacktrace'
      floor-file:
        description: 'Path (relative to repo root) of the per-module floor YAML.'
        type: string
        default: '.kover-floor.yml'
      default-floor:
        description: 'Line-coverage floor (%) for any module not listed in the floor file.'
        type: number
        default: 0
      upload-html-report:
        description: 'Whether to upload the aggregated HTML coverage report as an artifact.'
        type: boolean
        default: true
      html-report-path:
        description: 'Path of the aggregated HTML report directory (project-specific override).'
        type: string
        default: 'build/reports/kover/html'
      artifact-retention-days:
        description: 'Retention in days for the uploaded HTML coverage artifact.'
        type: number
        default: 14
      runs-on:
        description: 'Runner label.'
        type: string
        default: 'ubuntu-latest'
      timeout-minutes:
        description: 'Job timeout in minutes.'
        type: number
        default: 45

jobs:
  coverage:
    name: Enforce per-module coverage floor
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Fetch coverage-floor checker
        # Pin to the same ref the consumer called this workflow at so a tagged
        # version of the action ships a matching script. Falls back to main if
        # the ref isn't present in the action repo (e.g., for unreleased changes).
        run: |
          mkdir -p .actionhub-kover
          ACTION_REF="${{ github.action_ref || 'main' }}"
          URL="https://raw.githubusercontent.com/MobileByteLabs/mifos-x-actionhub-kover-coverage/${ACTION_REF}/scripts/check-coverage-floor.py"
          echo "Fetching $URL"
          curl -fsSL "$URL" -o .actionhub-kover/check-coverage-floor.py
          chmod +x .actionhub-kover/check-coverage-floor.py

      - name: Run kover aggregated XML report
        # `--continue` lets us harvest partial coverage when a downstream
        # module's compile is broken; the checker treats missing reports for
        # listed modules as hard failures, so silent-skip is still caught.
        run: ./gradlew ${{ inputs.report-task }} ${{ inputs.gradle-args }}
        continue-on-error: true

      - name: Check per-module coverage floor
        run: |
          python3 .actionhub-kover/check-coverage-floor.py \
            --floor-file "${{ inputs.floor-file }}" \
            --default-floor "${{ inputs.default-floor }}"

      - name: Upload aggregated HTML report
        if: ${{ always() && inputs.upload-html-report }}
        uses: actions/upload-artifact@v4
        with:
          name: kover-html-report
          path: ${{ inputs.html-report-path }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifact-retention-days }}
